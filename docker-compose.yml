services:
  sphynx:
    build: .
    container_name: sphynx-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./cache:/app/cache
      - ./config.json:/app/config.json:ro
    environment:
      # Listen on all interfaces inside the container so Docker port mapping works.
      # All other settings (PORT, cache sizes, TTL, timeouts) are read directly from config.json.
      - IP=0.0.0.0
